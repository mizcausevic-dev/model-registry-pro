[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-registry-pro"
version = "0.1.0"
description = "Model lifecycle catalog for AI agents - versions, lineage, stage promotion, and approval gates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mirza Causevic" }]
keywords = ["model-registry", "mlops", "lineage", "approval-workflow", "ai-agents", "platform-engineering", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/mizcausevic-dev/model-registry-pro"
Repository = "https://github.com/mizcausevic-dev/model-registry-pro"
Issues = "https://github.com/mizcausevic-dev/model-registry-pro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/model_registry_pro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
